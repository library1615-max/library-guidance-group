<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>網站後台登入｜圖書館輔導團</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f8f3e9,#dceced)}.login{width:min(440px,calc(100% - 32px));background:white;border-radius:20px;padding:34px;box-shadow:var(--shadow)}.login h1{font-family:"Noto Serif TC",serif;color:var(--navy);font-size:28px;margin:0 0 8px}.login p{color:var(--muted);font-size:13px}.login label{display:block;font-size:13px;font-weight:700;margin:18px 0 6px}.login input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit}.login button{width:100%;margin-top:22px;height:46px;border:0;border-radius:10px;background:var(--navy);color:white;font-weight:700}.notice{margin-top:18px;background:#f6f1e6;padding:12px;border-radius:10px;font-size:12px;color:#786a50}.back{display:inline-block;margin-top:18px;color:var(--teal);text-decoration:none;font-size:13px}</style></head><body><div class="login"><h1>網站後台登入</h1><p>此頁目前為介面原型，正式帳號、權限與資料庫會在後台階段接上。</p><label>帳號</label><input placeholder="請輸入管理帳號"><label>密碼</label><input type="password" placeholder="請輸入密碼"><button type="button" onclick="alert('目前為後台介面原型，尚未啟用正式登入。')">登入</button><div class="notice">🔐 正式版將加入管理員／編輯者權限、公告發布、活動卡片、附件上傳、外部網址與操作紀錄。</div><a class="back" href="index.html">← 返回首頁</a></div></body></html>
